{{- /*
Flux TTS render-time checks. Catch invalid combinations at install/upgrade
time instead of letting Engine or API pods crash-loop after rollout.
*/}}
{{- $fluxTtsValues := .Values.fluxTts | default dict }}
{{- $fluxTtsEnabled := eq (toString $fluxTtsValues.enabled) "true" }}
{{- $apiFeatures := (.Values.api | default dict).features | default dict }}
{{- $speakV2Enabled := or (eq (toString $apiFeatures.speakV2) "true") (eq (toString $apiFeatures.speakV2Streaming) "true") }}
{{- if $fluxTtsEnabled }}
{{- if (.Values.aura2 | default dict).enabled }}
{{- fail "Error: fluxTts and aura2 cannot both be enabled. Flux TTS and Aura-2 cannot share an Engine, and Engine refuses to start with both configured. Deploy them as separate releases of this chart." }}
{{- end }}
{{- if not $fluxTtsValues.uuid }}
{{- fail "Error: fluxTts.uuid must be set when fluxTts is enabled. Confirm the correct UUID with your Deepgram Account Representative." }}
{{- end }}
{{- if not $fluxTtsValues.maxBatchSize }}
{{- fail "Error: fluxTts.maxBatchSize must be set to a non-zero value when fluxTts is enabled. Contact your Deepgram Account Representative for a recommended value." }}
{{- end }}
{{- if and .Values.engine.customToml (contains "[flux_tts]" .Values.engine.customToml) }}
{{- fail "Error: engine.customToml contains its own [flux_tts] section. The chart renders [flux_tts] from the fluxTts values when fluxTts is enabled; remove the section from engine.customToml." }}
{{- end }}
{{- if not $speakV2Enabled }}
{{- fail "Error: fluxTts is enabled but the /v2/speak endpoint is not. Enable api.features.speakV2 (batch) and/or api.features.speakV2Streaming (streaming)." }}
{{- end }}
{{- else if $speakV2Enabled }}
{{- fail "Error: api.features.speakV2 and api.features.speakV2Streaming serve Flux TTS and require fluxTts.enabled. Enable fluxTts, or disable both features." }}
{{- end }}
{{- /*
The engine.toml body for one Engine type. The ConfigMap below and the
per-Deployment config checksum in engine.deployment.yaml both render this, so
a values change only rolls the Engine types whose config it actually changes.
Invoke with (dict "Values" $.Values "type" $type).
*/}}
{{- define "deepgram-self-hosted.engineToml" -}}
{{- $type := .type -}}
{{- $fluxTts := $.Values.fluxTts | default dict -}}
    {{- if $.Values.engine.concurrencyLimit.activeRequests }}
    max_active_requests = {{ $.Values.engine.concurrencyLimit.activeRequests }}
    {{- end }}

    [license]
      {{- if $.Values.billing.enabled }}
      server_url = ["https://{{ $.Values.billing.namePrefix }}-internal:{{ $.Values.billing.server.port}}"]
      key = "${DEEPGRAM_LICENSE_KEY}"
      {{- else }}
      server_url = [
        {{- if $.Values.licenseProxy.enabled }}
        "https://{{ $.Values.licenseProxy.namePrefix }}-internal:{{ $.Values.licenseProxy.server.port}}{{ $.Values.licenseProxy.server.baseUrl }}"
        {{- end }}
        {{- if or (not $.Values.licenseProxy.enabled) $.Values.licenseProxy.keepUpstreamServerAsBackup }}
        {{- if $.Values.licenseProxy.enabled -}},{{- end -}}"https://license.deepgram.com"
        {{- end }}
      ]
      {{- end }}

    [server]
      host = "{{ $.Values.engine.server.host }}"
      port = {{ $.Values.engine.server.port }}

    [metrics_server]
      host = "{{ $.Values.engine.metricsServer.host }}"
      port = {{ $.Values.engine.metricsServer.port }}

    [model_manager]
      search_paths = [
        "/models
        {{- if $.Values.engine.modelManager.volumes.customVolumeClaim.enabled -}}
          {{- if not (regexMatch `^\/` $.Values.engine.modelManager.volumes.customVolumeClaim.modelsDirectory) -}}
          /
          {{- end -}}
        {{- $.Values.engine.modelManager.volumes.customVolumeClaim.modelsDirectory -}}
        {{- end -}}"
      ]

    [features]
      multichannel = true
      language_detection = true
      streaming_ner = {{ $.Values.engine.features.streamingNer }}
      use_v2_language_detection = {{ $.Values.engine.features.useV2LanguageDetection }}

    [flux]
      enabled = {{ $.Values.engine.flux.enabled }}
      {{- if $.Values.engine.flux.max_streams }}
      max_streams = {{ $.Values.engine.flux.max_streams }}
      {{- end }}
      model_name = "{{ $.Values.engine.flux.model_name }}"
    {{- if and (eq (toString $fluxTts.enabled) "true") (or (not $.Values.agent.enabled) (eq $type "agent-text-to-speech")) }}

    [flux_tts]
      enabled = true
      uuid = "{{ $fluxTts.uuid }}"
      max_batch_size = {{ $fluxTts.maxBatchSize }}
    {{- end }}

    [chunking.batch]
      {{- if $.Values.engine.chunking.speechToText.batch.minDuration }}
      min_duration = {{ $.Values.engine.chunking.speechToText.batch.minDuration }}
      {{- end }}
      {{- if $.Values.engine.chunking.speechToText.batch.maxDuration }}
      max_duration = {{ $.Values.engine.chunking.speechToText.batch.maxDuration }}
      {{- end }}

    [chunking.streaming]
      {{- if $.Values.engine.chunking.speechToText.streaming.minDuration }}
      min_duration = {{ $.Values.engine.chunking.speechToText.streaming.minDuration }}
      {{- end }}
      {{- if $.Values.engine.chunking.speechToText.streaming.maxDuration }}
      max_duration = {{ $.Values.engine.chunking.speechToText.streaming.maxDuration }}
      {{- end }}
      step = {{ $.Values.engine.chunking.speechToText.streaming.step }}

    [health]
      gpu_required = {{ $.Values.engine.health.gpuRequired }}

    {{- if $.Values.engine.customToml }}
    {{ $.Values.engine.customToml | nindent 4 }}
    {{- end }}
{{- end }}
{{- $engineTypes := list }}
{{- if .Values.agent.enabled }}
{{- $engineTypes = list "agent-speech-to-text" "agent-text-to-speech" "agent-end-of-turn" }}
{{- else }}
{{- $engineTypes = list "" }}
{{- end }}
{{- range $type := $engineTypes }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Values.engine.namePrefix }}{{- if $type }}-{{ $type }}{{- end }}-config
  labels:
{{ include "deepgram-self-hosted.labels" $ | indent 4}}
    {{- range $key, $val := $.Values.engine.additionalLabels }}
    {{ $key }}: {{ $val | quote }}
    {{- end}}
data:
  engine.toml: |{{ include "deepgram-self-hosted.engineToml" (dict "Values" $.Values "type" $type) }}
{{- end }}
