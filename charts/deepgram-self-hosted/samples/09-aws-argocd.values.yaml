# Apply after your AWS values file in an Argo CD Application.
# EFS, its CSI driver, the namespace and suitable download nodes must already exist.
# Storage binds in wave -2, the download Job completes in wave -1,
# and workloads deploy in the default wave 0.
engine:
  modelManager:
    volumes:
      aws:
        efs:
          resourceAnnotations:
            argocd.argoproj.io/sync-wave: "-2"
          modelManagement:
            annotations:
              argocd.argoproj.io/hook: Sync
              argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
              argocd.argoproj.io/sync-wave: "-1"
