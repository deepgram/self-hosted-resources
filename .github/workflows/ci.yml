name: CI

on:
  pull_request:
    branches: [main]

jobs:
  helm-chart-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run helm lint
        run: helm lint ./charts/deepgram-self-hosted

      # `helm lint` does not evaluate the templates, so it misses nil pointer
      # dereferences and other render-time errors. Render the chart across the
      # deployment shapes we support instead.
      - name: Render chart templates
        run: |
          CHART=./charts/deepgram-self-hosted
          SECRET="--set global.deepgramSecretRef=ci-secret"
          VOL="--set engine.modelManager.volumes.customVolumeClaim.enabled=true --set engine.modelManager.volumes.customVolumeClaim.name=ci-pvc"
          FIPS_TAGS="--set api.image.tag=release-260812-fips --set engine.image.tag=release-260812-fips --set licenseProxy.image.tag=release-260812-fips"
          BILLING="--set billing.enabled=true --set global.deepgramLicenseSecretRef=ci-license --set billing.licenseFile.secretRef=ci-license-file"
          failed=0

          # render <renders|fails> <name> [helm args...]
          render() {
            expected=$1; name=$2; shift 2
            if helm template ci "$CHART" "$@" >/dev/null 2>/tmp/render-err; then actual=renders; else actual=fails; fi
            if [ "$expected" = "$actual" ]; then
              echo "  ok    $name"
            else
              echo "  FAIL  $name: expected to $expected, but it $actual"
              head -3 /tmp/render-err | sed 's/^/          /'
              failed=1
            fi
          }

          echo "Deployment shapes:"
          render renders "defaults"              $SECRET $VOL
          render renders "license proxy"         $SECRET $VOL --set licenseProxy.enabled=true
          render renders "fips enabled"          $SECRET $VOL --set licenseProxy.enabled=true --set global.fips.enabled=true $FIPS_TAGS
          render renders "fips disabled"         $SECRET $VOL --set global.fips.enabled=false
          render renders "fips with billing"     $SECRET $VOL --set global.fips.enabled=true $FIPS_TAGS $BILLING --set billing.image.tag=release-260812-fips

          # Values from a release created by an older chart do not contain keys
          # added since, and `helm upgrade --reuse-values` ignores the new
          # chart's defaults.
          echo "Upgrade from an older chart (--reuse-values):"
          render renders "newer keys absent"     $SECRET $VOL \
            --set global.fips=null --set fluxTts=null \
            --set api.features.speakV2=null --set api.features.speakV2Streaming=null

          echo "Sample values files:"
          render renders "01 aws"                -f $CHART/samples/01-basic-setup-aws.values.yaml
          render renders "02 gcp"                -f $CHART/samples/02-basic-setup-gcp.yaml
          render renders "03 onprem"             -f $CHART/samples/03-basic-setup-onprem.yaml
          render renders "04 aura-2"             -f $CHART/samples/04-aura-2-setup.values.yaml $VOL
          render renders "05 voice agent"        -f $CHART/samples/05-voice-agent-aws.values.yaml
          render renders "06 aura-2 polyglot"    -f $CHART/samples/06-aura-2-polyglot-setup.values.yaml $VOL
          render renders "07 airgapped billing"  -f $CHART/samples/07-basic-setup-aws-airgapped.values.yaml
          render renders "08 flux tts"           -f $CHART/samples/08-flux-tts-setup.values.yaml $VOL --set fluxTts.maxBatchSize=4

          # The chart rejects these at render time so pods do not crash-loop
          # after rollout. Assert the checks still fire.
          echo "Invalid configurations:"
          render fails "fips on a standard tag"  $SECRET $VOL --set global.fips.enabled=true --set api.image.tag=release-260714
          render fails "fips on the default tags" $SECRET $VOL --set global.fips.enabled=true
          render fails "fips below the -fips floor" $SECRET $VOL --set global.fips.enabled=true --set api.image.tag=release-260714-fips --set engine.image.tag=release-260714-fips
          render fails "fips on a standard billing tag" $SECRET $VOL --set global.fips.enabled=true $FIPS_TAGS $BILLING
          render fails "fips in api.customToml"  $SECRET $VOL --set global.fips.enabled=true $FIPS_TAGS --set-string 'api.customToml=[fips]'
          render fails "flux tts without batch"  $SECRET $VOL --set fluxTts.enabled=true --set fluxTts.uuid=u --set api.features.speakV2=true
          render fails "flux tts with aura-2"    $SECRET $VOL --set fluxTts.enabled=true --set fluxTts.uuid=u --set fluxTts.maxBatchSize=4 --set api.features.speakV2=true --set aura2.enabled=true

          exit $failed

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Install helm-docs
        run: |
          go install github.com/norwoodj/helm-docs/cmd/helm-docs@latest

      - name: Run helm-docs
        run: |
          helm-docs

      - name: Check if README.md is up to date
        run: |
          if ! git diff --quiet -- ./charts/deepgram-self-hosted/README.md; then
            echo "README.md is out of date. Please run helm-docs and commit the changes."
            exit 1
          fi

      - name: Check that chart version is bumped if chart appVersion is bumped
        run: |
          CHART_DIR="charts/deepgram-self-hosted"
          if [ ! -f "$CHART_DIR/Chart.yaml" ]; then
            echo "Error: Chart.yaml not found in $CHART_DIR"
            exit 1
          fi

          OLD_VERSION=$(git show origin/$GITHUB_BASE_REF:$CHART_DIR/Chart.yaml | grep '^version:' | awk '{print $2}')
          NEW_VERSION=$(grep '^version:' $CHART_DIR/Chart.yaml | awk '{print $2}')
          OLD_APP_VERSION=$(git show origin/$GITHUB_BASE_REF:$CHART_DIR/Chart.yaml | grep '^appVersion:' | awk '{print $2}')
          NEW_APP_VERSION=$(grep '^appVersion:' $CHART_DIR/Chart.yaml | awk '{print $2}')

          if [[ "$OLD_VERSION" = "$NEW_VERSION" ]] && [[ "$OLD_APP_VERSION" != "$NEW_APP_VERSION" ]]; then
            echo "Error: In $CHART_DIR/Chart.yaml, appVersion has been changed but version has not been bumped"
            echo "Old appVersion: $OLD_APP_VERSION"
            echo "New appVersion: $NEW_APP_VERSION"
            echo "Chart version: $NEW_VERSION"
            echo "Chart version should be bumped anytime the application version is bumped."
            exit 1
          fi

      - name: Check that the chart changelog has been updated if the chart has changes
        run: |
          CHART_DIR="charts/deepgram-self-hosted"

          echo "Non-documentation files changed in chart directory:"
          # If there are changes to the chart directory besides the changelog file or documentation...
          if git diff --name-only origin/"$GITHUB_BASE_REF"... $CHART_DIR | grep -vE "^$CHART_DIR/(CHANGELOG\.md|README\.md(\..*)?)"; then
          # ...make sure the changelog file is updated as well
            if ! git diff --name-only origin/"$GITHUB_BASE_REF"... "$CHART_DIR/CHANGELOG.md" | grep -q "$CHART_DIR/CHANGELOG.md"; then
              echo "Detected changes to non-documentation files the helm chart directory, but the chart CHANGELOG.md was not updated."
              echo "Please add a short desription of changes to the changelog under the \"Unreleased\" header."
              exit 1
            fi
          fi

  diagnostic-scripts-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes in diagnostic directory
        id: check_changes
        run: |
          git diff --name-only origin/${{ github.base_ref }}..HEAD -- diagnostics/*.sh > changed_files.txt
          if [ -s changed_files.txt ]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi
      - name: Install ShellCheck
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: sudo apt-get install -y shellcheck
      - name: Install shfmt
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run ShellCheck
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          while IFS= read -r file; do
            if [[ "$file" == *.sh ]]; then
              shellcheck "$file"
            fi
          done < changed_files.txt
      - name: Run shfmt
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          while IFS= read -r file; do
            if [[ "$file" == *.sh ]]; then
              if ! shfmt -d "$file"; then
                echo "Error: $file is not correctly formatted. Run 'shfmt -w $file' to fix."
                exit 1
              fi
            fi
          done < changed_files.txt
